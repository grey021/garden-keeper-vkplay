<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Смотритель сада</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		
#status { background: #17110d; }
#status-splash.fullsize--true { object-fit: cover; }
#status-progress { bottom: 7%; width: min(320px, 52%); height: 5px; border: 0; border-radius: 3px; overflow: hidden; background: rgba(235, 217, 181, .25); color: #d4b37c; box-shadow: 0 1px 4px rgba(0, 0, 0, .65); }
#status-progress::-webkit-progress-bar { background: rgba(235, 217, 181, .25); }
#status-progress::-webkit-progress-value { background: #d4b37c; }
#status-progress::-moz-progress-bar { background: #d4b37c; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<!-- VK Play iframe API. Project/GMRID 51050. No advertising SDK is loaded. -->
<style>
canvas { touch-action: none; user-select: none; -webkit-user-select: none; }
html, body { overscroll-behavior: none; }
</style>
<script>
(function () {
  'use strict';
  var lang = (new URLSearchParams(location.search).get('lang') || 'ru').toLowerCase();
  lang = /^ru(?:[_-]|$)/.test(lang) ? 'ru' : 'en';
  var bridge = window.yagame = {
    platform: 'vkplay', appid: 51050, api: null, ysdk: null,
    loading: true, cloudLoaded: true, cloud: null, paused: document.hidden,
    readySent: false, gameplayActive: false, loginStatus: 0,
    sdkState: 'loading', adsEnabled: false, leaderboardAvailable: false,
    // VK Play JS API has no GamePush cloud/leaderboard equivalents.
    // Godot persists saves in this browser's IndexedDB; no fake cloud sync.
    save: function () {},
    ready: function () { this.readySent = true; },
    gameplay: function (active) { this.gameplayActive = !!active; },
    canReward: function () { return false; },
    ad: 'error', adRewarded: false, fs: 'closed',
    showReward: function () { this.ad = 'error'; this.adRewarded = false; },
    showFullscreen: function () { this.fs = 'closed'; },
    top: null, topLoaded: true,
    setRecord: function () {},
    loadTop: function () { this.top = null; this.topLoaded = true; },
    checkAuth: function () { return this.loginStatus === 2 || this.loginStatus === 3; },
    // No client-only entitlement grants. Enable payments only with a verified backend.
    payments: null, products: [], catalog: [], payState: 'error',
    buy: function () { this.payState = 'error'; },
    login: function () {
      if (!this.api) return;
      try {
        if (this.loginStatus === 1) this.api.registerUser();
        else if (this.loginStatus === 0) this.api.authUser();
      } catch (e) { console.warn('[VK Play] Login could not be opened.'); }
    }
  };
  // Compatibility facade for the existing platform-neutral GDScript bridge.
  bridge.ysdk = { environment: { i18n: { lang: lang } } };
  document.addEventListener('visibilitychange', function () { bridge.paused = document.hidden; });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  function fail() {
    if (bridge.sdkState === 'connected') return;
    bridge.sdkState = 'unavailable'; bridge.loading = false;
  }
  var deadline = setTimeout(fail, 8000);
  function connect() {
    if (typeof window.iframeApi !== 'function') { fail(); return; }
    var callbacks = {
      appid: 51050,
      getLoginStatusCallback: function (data) {
        if (data && data.status === 'ok') {
          var value = Number(data.loginStatus);
          bridge.loginStatus = [0, 1, 2, 3].indexOf(value) >= 0 ? value : 0;
        }
      },
      registerUserCallback: function (data) {
        if (data && data.status === 'ok' && bridge.api) bridge.api.getLoginStatus();
      },
      userInfoCallback: function () {}, userProfileCallback: function () {},
      getAuthTokenCallback: function () {}, paymentFrameUrlCallback: function () {},
      paymentReceivedCallback: function () {}, paymentWindowClosedCallback: function () {},
      userConfirmCallback: function () {}, confirmWindowClosedCallback: function () {},
      paymentFrameItem: function () {}, getGameInventoryItemsCallback: function () {}
    };
    try {
      Promise.resolve(window.iframeApi(callbacks)).then(function (api) {
        if (!api || typeof api.getLoginStatus !== 'function') { fail(); return; }
        clearTimeout(deadline);
        bridge.api = api; bridge.sdkState = 'connected'; bridge.loading = false;
        try { api.getLoginStatus(); } catch (e) { /* Guest gameplay remains available. */ }
      }, fail);
    } catch (e) { fail(); }
  }
  var script = document.createElement('script');
  script.src = 'https://vkplay.ru/app/51050/static/mailru.core.js';
  script.async = true;
  script.onload = function () {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', connect, { once: true });
    else connect();
  };
  script.onerror = fail;
  document.head.appendChild(script);
}());
</script>


	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="loading-garden.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":19155640,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
